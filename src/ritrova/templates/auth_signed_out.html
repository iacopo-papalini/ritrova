{% extends "base.html" %}
{% block title %}Signed out · Ritrova{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl px-4 py-16 text-center">
  <h1 class="text-2xl font-semibold">Signed out</h1>
  <p class="mt-4 text-gray-600">Your Ritrova session has ended.</p>
  <p class="mt-2 text-sm text-gray-500">You are still signed in to Google itself.</p>
  <a href="/auth/login"

    Sign in again
  </a>
</div>
{% endblock %}
