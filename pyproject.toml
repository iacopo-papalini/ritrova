[project]
name = "ritrova"
version = "0.2.0"
description = "Ritrova — find again: face and pet recognition for personal photo archives"
requires-python = ">=3.14"
# Base install = everything `ritrova serve` and the browsing/clustering CLI
# commands need. No model runtimes, so no torch / CUDA wheels.
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "scipy>=1.11.0",
    "pillow>=10.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "click>=8.1.0",
    "python-dotenv>=1.2.2",
    "faiss-cpu>=1.13.2",
]

[project.optional-dependencies]
# Detection + embedding model runtimes: InsightFace (faces), YOLO + SigLIP
# (pets). Needed by `ritrova analyse` and by the web app's manual-finding
# creation, which embeds the crop you draw. Install with `uv sync --extra scan`.
scan = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0; sys_platform != 'win32'",
    "onnxruntime-gpu>=1.17.0; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "ultralytics>=8.1.0",
    "transformers>=4.56.0",
    "sentencepiece>=0.2.1",
    "torch>=2.0.0",
    "torchvision>=0.26.0",
]

# VLM-powered captioning and en→it translation. Opt-in via `--caption` on
# `ritrova analyse`; install with `uv sync --extra caption`. Apple Silicon
# only — the MLX backend is the only supported VLM runtime.
caption = [
    "ritrova[scan]",
    "mlx-vlm>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sacremoses>=0.1.1",
]

[project.scripts]
ritrova = "ritrova.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.7.2",
    "ruff>=0.15.9",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# Linux gets the CPU-only build: PyPI's default torch wheel drags in ~3 GB of
# nvidia-* CUDA libraries that the serving box has no GPU to run.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET", "T20", "LOG"]
ignore = ["E501", "UP047"]

[tool.ruff.lint.per-file-ignores]
"src/ritrova/app/**/*.py" = ["B008"]
"src/ritrova/cli.py" = ["T20"]
"src/ritrova/scanner.py" = ["T20"]
"src/ritrova/scan_pipeline.py" = ["T20"]
# Operational / investigation scripts are CLI-style runners; print() is the point.
"scripts/*.py" = ["T20"]
"scripts/investigations/*.py" = ["T20"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
